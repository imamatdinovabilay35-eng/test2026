<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Test AI</title>
    <!-- Tailwind CSS v4 дұрыс қосылуы -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
    </style>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: 'Inter', sans-serif; 
        }
        .glass-card { 
            background: rgba(17, 24, 39, 0.7); 
            backdrop-filter: blur(10px); 
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- Жоғарғы панель және Тіл таңдау -->
        <div class="flex justify-between items-center glass-card p-3 rounded-2xl border border-gray-800">
            <span class="text-xs font-semibold text-blue-400 bg-blue-950/50 px-2.5 py-1 rounded-lg">AI Platform</span>
            <select id="langSelect" onchange="changelanguage(this.value)" class="bg-gray-900 text-gray-200 text-xs px-2 py-1 rounded-lg border border-gray-700 outline-none">
                <option value="kk">Қазақша</option>
                <option value="uz">O'zbekcha</option>
                <option value="ru">Русский</option>
                <option value="kaa">Qaraqalpaqsha</option>
            </select>
        </div>

        <!-- Негізгі карточка -->
        <div class="glass-card p-4 rounded-2xl border border-gray-800 space-y-3">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600/20 p-2.5 rounded-xl text-blue-400">
                    💻
                </div>
                <div>
                    <h1 class="text-sm font-bold text-white">Informatika Test AI</h1>
                    <p class="text-xs text-gray-400">1,000 та саралған professional тестлар</p>
                </div>
            </div>

            <!-- Түймелер панелі -->
            <div class="grid grid-cols-3 gap-2 pt-2">
                <button onclick="openSection('biletlar')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1 cursor-pointer">
                    <span>🎫</span>
                    <span>Biletlar</span>
                </button>
                <button onclick="openSection('imtihon')" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-medium py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1 cursor-pointer">
                    <span>📝</span>
                    <span>Imtihon</span>
                </button>
                <button onclick="openSection('statistika')" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-medium py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1 cursor-pointer">
                    <span>📊</span>
                    <span>Statistika</span>
                </button>
            </div>
        </div>

        <!-- Бөлімдер тізімі -->
        <div class="text-xs text-gray-400 px-1">bo'limlardan birini tanlang</div>

        <div class="glass-card p-4 rounded-2xl border border-gray-800 flex items-center justify-between cursor-pointer hover:border-blue-500/50 transition">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600/20 p-2 rounded-xl text-blue-400">
                    🖥️
                </div>
                <div>
                    <h2 class="text-xs font-bold text-white">Kompyuter tarixi va qurilmalari</h2>
                    <p class="text-[11px] text-gray-400">CPU, xotira, kiritish-chiqarish qurilmalari (250+ savol)</p>
                </div>
            </div>
            <span class="text-gray-500">→</span>
        </div>

    </div><!-- JavaScript логикасы (түймелер жұмыс істеуі үшін) -->
    <script>
        function changelanguage(lang) {
            console.log("Таңдалған тіл:", lang);
            // Тілді өзгерту логикасы
        }

        function openSection(sectionName) {
            console.log("Ашылған бөлім:", sectionName);
            // Бөлімдерді ашу логикасы
        }
    </script>
</body>
</html>﻿
