<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Test AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            font-family: 'Inter', sans-serif; 
        }
        .glass-card { 
            background: rgba(17, 24, 39, 0.7); 
            backdrop-filter: blur(10px); 
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- Басты мәзір -->
        <div id="main-menu" class="space-y-4">
            <!-- Жоғарғы панель және Тіл таңдау -->
            <div class="flex justify-between items-center glass-card p-3 rounded-2xl border border-gray-800">
                <span id="txt-ai" class="text-xs font-semibold text-blue-400 bg-blue-950/50 px-2.5 py-1 rounded-lg">AI Platform</span>
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-900 text-gray-200 text-xs px-2 py-1 rounded-lg border border-gray-700 outline-none cursor-pointer">
                    <option value="kk">Қазақша</option>
                    <option value="uz">O'zbekcha</option>
                    <option value="ru">Русский</option>
                    <option value="kaa">Qaraqalpaqsha</option>
                </select>
            </div>

            <!-- Негізгі карточка -->
            <div class="glass-card p-4 rounded-2xl border border-gray-800 space-y-3">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600/20 p-2.5 rounded-xl text-blue-400">💻</div>
                    <div>
                        <h1 class="text-sm font-bold text-white">Informatika Test AI</h1>
                        <p id="txt-desc" class="text-xs text-gray-400">1,000-нан астам саралған кәсіби тесттер</p>
                    </div>
                </div>

                <!-- Түймелер панелі -->
                <div class="grid grid-cols-3 gap-2 pt-2">
                    <button onclick="startTest()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1 cursor-pointer shadow-lg">
                        <span>🎫</span> <span id="btn-bilet">Билеттер</span>
                    </button>
                    <button onclick="startTest()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-medium py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1 cursor-pointer">
                        <span>📝</span> <span id="btn-imtihon">Емтихан</span>
                    </button>
                    <button onclick="openSection('statistika')" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-medium py-2 px-3 rounded-xl transition flex items-center justify-center space-x-1 cursor-pointer">
                        <span>📊</span> <span id="btn-stat">Статистика</span>
                    </button>
                </div>
            </div>

            <!-- Бөлімдер тізімі -->
            <div id="txt-select-section" class="text-xs text-gray-400 px-1">Бөлімдердің бірін таңлаңыз</div>

            <div onclick="startTest()" class="glass-card p-4 rounded-2xl border border-gray-800 flex items-center justify-between cursor-pointer hover:border-blue-500/50 transition">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600/20 p-2 rounded-xl text-blue-400">🖥️</div>
                    <div>
                        <h2 class="text-xs font-bold text-white">Kompyuter tarixi va qurilmalari</h2>
                        <p class="text-[11px] text-gray-400">CPU, xotira, kiritish-chiqarish qurilmalari (Testni boshlash)</p>
                    </div>
                </div>
                <span class="text-gray-500">→</span>
            </div>
        </div><!-- Тест шығатын бет -->
        <div id="content-section" class="glass-card p-4 rounded-2xl border border-gray-800 hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 id="section-title" class="text-sm font-bold text-white">Информатика тесті</h2>
                <button onclick="goBack()" class="bg-gray-800 text-gray-300 text-xs px-3 py-1.5 rounded-lg hover:bg-gray-700 cursor-pointer">← Артқа</button>
            </div>
            
            <!-- Тест сұрағы мен нұсқалар орналасатын жер -->
            <div id="quiz-container" class="space-y-3">
                <p id="question-text" class="text-xs font-semibold text-white">Сұрақ жүктелуде...</p>
                <div id="options-container" class="space-y-2">
                    <!-- Жауап нұсқалары осында түседі -->
                </div>
            </div>
        </div>

    </div>

    <!-- Логика және тест сұрақтары -->
    <script>
        const quizData = [
            {
                question: "1. Дербес компьютердің негізгі миы (процессор) қай жылы жасалды?",
                options: ["1971 жылы (Intel 4004)", "1981 жылы", "1965 жылы", "1990 жылы"],
                correct: 0
            },
            {
                question: "2. Ақпаратты өлшеудің ең кіші бірлігін атаңыз:",
                options: ["Байт", "Бит", "Кейл", "Мегабайт"],
                correct: 1
            },
            {
                question: "3. Төмендегілердің қайсысы жүйелік бағдарламалық қамтамасыз етуге жатады?",
                options: ["Microsoft Word", "Windows операциялық жүйесі", "Adobe Photoshop", "Paint"],
                correct: 1
            }
        ];

        let currentQuestionIndex = 0;

        const translations = {
            kk: { bilet: "Билеттер", imtihon: "Емтихан", stat: "Статистика", selectSec: "Бөлімдердің бірін таңлаңыз", desc: "1,000-нан астам саралған кәсіби тесттер" },
            uz: { bilet: "Biletlar", imtihon: "Imtihon", stat: "Statistika", selectSec: "Bo'limlardan birini tanlang", desc: "1,000 tadan ortiq saralangan professional testlar" },
            ru: { bilet: "Билеты", imtihon: "Экзамен", stat: "Статистика", selectSec: "Выберите один из разделов", desc: "Более 1,000 отборных профессиональных тестов" },
            kaa: { bilet: "Biletler", imtihon: "Imtixan", stat: "Statistika", selectSec: "Bólimlerden birin tańlań", desc: "1,000 nan artıq saralanǵan kásipliy testler" }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            if (t) {
                document.getElementById('btn-bilet').innerText = t.bilet;
                document.getElementById('btn-imtihon').innerText = t.imtihon;
                document.getElementById('btn-stat').innerText = t.stat;
                document.getElementById('txt-select-section').innerText = t.selectSec;
                document.getElementById('txt-desc').innerText = t.desc;
            }
        }

        function startTest() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('content-section').classList.remove('hidden');
            currentQuestionIndex = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.question;
            
            const optionsDiv = document.getElementById('options-container');
            optionsDiv.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-gray-900/80 hover:bg-blue-600/30 border border-gray-700 text-gray-200 text-xs p-2.5 rounded-xl transition cursor-pointer";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsDiv.appendChild(btn);
            });
        }function checkAnswer(selectedIndex, buttonElement) {
            const q = quizData[currentQuestionIndex];
            const optionsDiv = document.getElementById('options-container');
            const buttons = optionsDiv.getElementsByTagName('button');

            // Барлық түймелерді бұғаттау
            for (let b of buttons) {
                b.disabled = true;
            }

            if (selectedIndex === q.correct) {
                buttonElement.classList.add('bg-green-600/40', 'border-green-500');
                buttonElement.innerText += " ✅ Дұрыс!";
            } else {
                buttonElement.classList.add('bg-red-600/40', 'border-red-500');
                buttonElement.innerText += " ❌ Қате";
                buttons[q.correct].classList.add('bg-green-600/40', 'border-green-500');
            }

            // Келесі сұраққа өту батырмасын шығару
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    document.getElementById('quiz-container').innerHTML = 
                        <div class="text-center py-6 space-y-2">
                            <h3 class="text-sm font-bold text-white">🎉 Тест аяқталды!</h3>
                            <p class="text-xs text-gray-400">Барлық сұрақтарға жауап бердіңіз.</p>
                            <button onclick="startTest()" class="bg-blue-600 text-white text-xs px-4 py-2 rounded-xl mt-2 cursor-pointer">Қайта бастау</button>
                        </div>
                    ;
                }
            }, 1500);
        }

        function goBack() {
            document.getElementById('content-section').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }
    </script>
</body>
</html>
