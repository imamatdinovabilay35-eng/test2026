<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ұстаз & Аттестация Тренажері</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between p-4">

    <div class="max-w-xl mx-auto w-full bg-gray-900 p-6 rounded-2xl shadow-xl border border-gray-800">
        <!-- Шапка және Тіл таңдау -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 id="ui-title" class="text-xl font-bold text-green-400">🎓 AI Ұстаз & Аттестация</h1>
                <p id="ui-subtitle" class="text-xs text-gray-400">Барлық пән бойынша шексіз дайындық жүйесі</p>
            </div>
            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-800 text-white text-sm p-2 rounded-lg border border-gray-700">
                <option value="kk">Қазақша</option>
                <option value="uz">O'zbekcha</option>
                <option value="kaa">Qaraqalpaqsha</option>
                <option value="ru">Русский</option>
            </select>
        </div>

        <!-- Баптаулар бөлімі -->
        <div id="setup-section" class="space-y-4">
            <div>
                <label id="lbl-key" class="block text-sm font-medium text-gray-300 mb-1">Gemini API Key енгізіңіз:</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-green-500 outline-none">
            </div>

            <div>
                <label id="lbl-subject" class="block text-sm font-medium text-gray-300 mb-1">Пәнді таңдаңыз:</label>
                <select id="subjectSelect" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
                    <option value="Informatics">Информатика</option>
                    <option value="Pedagogy">Педагогика және психология</option>
                    <option value="Mathematics">Математика</option>
                    <option value="History">Қазақстан тарихы / Тарих</option>
                    <option value="Biology">Биология</option>
                    <option value="Physics">Физика</option>
                </select>
            </div>

            <div>
                <label id="lbl-goal" class="block text-sm font-medium text-gray-300 mb-1">Мақсатыңыз:</label>
                <select id="goalSelect" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
                    <option value="Attestation">Мұғалімдер аттестациясы</option>
                    <option value="Certification">Ұлттық сертификаттау</option>
                </select>
            </div>

            <button onclick="startQuiz()" id="startBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg mt-2">
                🚀 Шексіз Тестті Бастау
            </button>
        </div>

        <!-- Тест жүретін орын -->
        <div id="quiz-section" class="hidden space-y-4">
            <div class="flex justify-between text-xs text-gray-400">
                <span id="scoreText">Ұпай: 0</span>
                <span id="qNumText">Сұрақ: 1</span>
            </div>
            <div id="questionContainer" class="text-lg font-medium text-gray-100"></div>
            <div id="optionsContainer" class="space-y-2"></div>
            <div id="explanationContainer" class="text-sm text-gray-300 bg-gray-800 p-3 rounded-lg hidden"></div>
            <button id="nextBtn" onclick="loadNextQuestion()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl hidden">
                Келесі сұрақ ➡️
            </button>
        </div>
    </div><script>
        // Тілдік аудармалар
        const translations = {
            kk: {
                title: "🎓 AI Ұстаз & Аттестация",
                subtitle: "Барлық пән бойынша шексіз дайындық жүйесі",
                lblKey: "Gemini API Key енгізіңіз:",
                lblSubject: "Пәнді таңдаңыз:",
                lblGoal: "Мақсатыңыз:",
                startBtn: "🚀 Шексіз Тестті Бастау",
                nextBtn: "Келесі сұрақ ➡️",
                attestation: "Мұғалімдер аттестациясы",
                certification: "Ұлттық сертификаттау"
            },
            uz: {
                title: "🎓 AI Ustoz & Attestatsiya",
                subtitle: "Barcha fanlar bo'yicha cheksiz tayyorgarlik tizimi",
                lblKey: "Gemini API Key kiriting:",
                lblSubject: "Fanni tanlang:",
                lblGoal: "Maqsadingiz:",
                startBtn: "🚀 Cheksiz Testni Boshlash",
                nextBtn: "Keyingi savol ➡️",
                attestation: "O'qituvchilar attestatsiyasi",
                certification: "Milliy sertifikatlash"
            },
            kaa: {
                title: "🎓 AI Ustaz & Attestatsiya",
                subtitle: "Barlıq pánler boyınsha sheksiz tayarlıq sisteması",
                lblKey: "Gemini API Key kiritiń:",
                lblSubject: "Pándi tańlań:",
                lblGoal: "Maqsetińiz:",
                startBtn: "🚀 Sheksiz Testti Baslaw",
                nextBtn: "Keyingi soraw ➡️",
                attestation: "Muǵallimler attestatsiyası",
                certification: "Milliy sertifikatsiya"
            },
            ru: {
                title: "🎓 AI Учитель & Аттестация",
                subtitle: "Система безлимитной подготовки по всем предметам",
                lblKey: "Введите Gemini API Key:",
                lblSubject: "Выберите предмет:",
                lblGoal: "Ваша цель:",
                startBtn: "🚀 Начать безлимитный тест",
                nextBtn: "Следующий вопрос ➡️",
                attestation: "Аттестация учителей",
                certification: "Национальная сертификация"
            }
        };

        let currentLang = 'kk';
        let score = 0;
        let questionCount = 0;
        let currentQuestionData = null;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-key').innerText = t.lblKey;
            document.getElementById('lbl-subject').innerText = t.lblSubject;
            document.getElementById('lbl-goal').innerText = t.lblGoal;
            document.getElementById('startBtn').innerText = t.startBtn;
            document.getElementById('nextBtn').innerText = t.nextBtn;
            
            // Мақсаттарды ауыстыру
            const goalSelect = document.getElementById('goalSelect');
            goalSelect.options[0].text = t.attestation;
            goalSelect.options[1].text = t.certification;
        }

        async function startQuiz() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert(currentLang === 'kk' ? "API кілтін енгізіңіз!" : "API kalitini kiriting!");
                return;
            }
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            loadNextQuestion();
        }

        async function loadNextQuestion() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const subject = document.getElementById('subjectSelect').value;const goal = document.getElementById('goalSelect').value;
            
            document.getElementById('explanationContainer').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('questionContainer').innerText = currentLang === 'kk' ? "ЖИ сұрақ дайындауда..." : "AI savol tayyorlamqda...";
            document.getElementById('optionsContainer').innerHTML = "";

            questionCount++;
            document.getElementById('qNumText').innerText = (currentLang === 'kk' ? "Сұрақ: " : "Savol: ") + questionCount;

            const prompt = Generate 1 multiple choice question for teacher attestation/certification in subject "${subject}" with goal "${goal}". 
            Language must be strictly in ISO code: "${currentLang}" (kk=Kazakh, uz=Uzbek, kaa=Karakalpak, ru=Russian). 
            Return ONLY a valid JSON object with format:
            {
               "question": "...",
               "options": ["A) ...", "B) ...", "C) ...", "D) ..."],
               "correct": 0,
               "explanation": "..."
            } where correct is the index (0 to 3) of the correct option.;

            try {
                const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/`json/g, '').replace(/```/g, '').trim();
                currentQuestionData = JSON.parse(text);

                document.getElementById('questionContainer').innerText = currentQuestionData.question;
                const optContainer = document.getElementById('optionsContainer');
                
                currentQuestionData.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left bg-gray-800 hover:bg-gray-700 p-3 rounded-xl border border-gray-700 transition";
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(index, btn);
                    optContainer.appendChild(btn);
                });

            } catch (error) {
                alert("Қате орынғалды немесе API кілті дұрыс емес!");
                document.getElementById('setup-section').classList.remove('hidden');
                document.getElementById('quiz-section').classList.add('hidden');
            }
        }

        function checkAnswer(selectedIndex, btnElement) {
            const buttons = document.getElementById('optionsContainer').getElementsByTagName('button');
            for (let b of buttons) { b.disabled = true; }

            if (selectedIndex === currentQuestionData.correct) {
                btnElement.classList.add('bg-green-700', 'border-green-500');
                score += 10;
            } else {
                btnElement.classList.add('bg-red-700', 'border-red-500');
                buttons[currentQuestionData.correct].classList.add('bg-green-700', 'border-green-500');
            }

            document.getElementById('scoreText').innerText = (currentLang === 'kk' ? "Ұпай: " : "Ball: ") + score;
            const expDiv = document.getElementById('explanationContainer');
            expDiv.innerText = "💡 " + currentQuestionData.explanation;
            expDiv.classList.remove('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        }
    </script>
</body>
</html>
