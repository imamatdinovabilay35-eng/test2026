<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ұстаз & Аттестация Тренажеры</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Бастапқы экран -->
    <div id="setup-card" class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl mb-6">
        <h1 class="text-2xl font-bold text-emerald-400 mb-2 text-center">
            <i class="fa-solid fa-graduation-cap mr-2"></i> Ұстаз & Аттестация Тренажеры
        </h1>
        <p class="text-slate-400 text-sm text-center mb-6">Аттестация мен сертификаттауға арналған арнайы тест жүйесі</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Пәнді таңдаңыз:</label>
                <select id="subject-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">
                    <option value="informatika">Информатика</option>
                    <option value="pedagogika">Педагогика мен психология</option>
                </select>
            </div>

            <button onclick="startQuiz()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-900/40 mt-2">
                🚀 Тестті Бастау
            </button>
        </div>
    </div>

    <!-- Тест экраны -->
    <div id="quiz-card" class="hidden max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
            <div>
                <span id="current-subject" class="text-xs bg-emerald-900/50 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-semibold"></span>
            </div>
            <div class="text-sm font-medium text-slate-400">
                Сұрақ: <span id="current-num" class="text-emerald-400 font-bold">1</span> / <span id="total-num" class="font-bold">0</span> | Дұрыс: <span id="score" class="text-emerald-400 font-bold">0</span>
            </div>
        </div>

        <div id="quiz-content">
            <h2 id="question-text" class="text-lg font-semibold mb-6 text-slate-100"></h2>
            
            <div id="options-container" class="space-y-3 mb-6"></div>

            <!-- Түсіндірме -->
            <div id="explanation-box" class="hidden p-5 rounded-xl mb-6 text-sm border transition-all">
                <div class="font-bold flex items-center mb-2">
                    <i class="fa-solid fa-chalkboard-user mr-2 text-lg"></i>
                    <span>Түсіндірме:</span>
                </div>
                <div id="explanation-text" class="leading-relaxed space-y-2"></div>
            </div>

            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition">
                Келесі сұрақ ➔
            </button>
        </div>
    </div>

    <script>
        const quizDatabase = {
            informatika: [
                {
                    id: 1,
                    question: "Python тілінде тізімнің (list) соңына жаңа элемент қосу үшін қандай әдіс қолданылады?",
                    options: ["A) add()", "B) append()", "C) insert()", "D) extend()"],
                    correct: "B",
                    explanation: "append() әдісі тізімнің соңына дәл бір элемент қосады."
                },
                {
                    id: 2,
                    question: "Excel немесе Google Sheets бағдарламасында берілген шартты тексеру үшін қай функция қолданылады?",
                    options: ["A) IF (ЕСЛИ)", "B) VLOOKUP (ВПР)", "C) SUM (СУММ)", "D) COUNT (СЧЕТ)"],
                    correct: "A",
                    explanation: "IF функциясы шартты тексереді (егер шарт ақиқат болса - бір мән, жалған болса - басқа мән береді)."
                },
                {
                    id: 3,
                    question: "GitHub платформасы не үшін қолданылады?",
                    options: ["A) Сурет өңдеу үшін", "B) Кодтарды сақтау және версияларын басқару үшін", "C) Видео монтаждау үшін", "D) Интернет желісін баптау үшін"],
                    correct: "B",
                    explanation: "GitHub - бұл бағдарлама кодын сақтауға, ортақ жұмыс істеуге және өзгерістерді бақылауға арналған жүйе."
                }
            ],
            pedagogika: [
                {
                    id: 1,
                    question: "Қалыптастырушы бағалаудың басты мақсаты не?",
                    options: ["A) Тоқсандық баға қою", "B) Оқу процесін түзету және оқушыға кері байланыс беру", "C) Емтихан алу", "D) Оқушыларды өзара салыстыру"],
                    correct: "B",
                    explanation: "Қалыптастырушы бағалау оқушының біліміндегі олқылықтарды анықтап, дер кезінде көмектесуге бағытталған."
                },
                {
                    id: 2,
                    question: "Блум таксономиясының ең жоғарғы деңгейі қайсысы?",
                    options: ["A) Түсіну", "B) Қолдану", "C) Бағалау (немесе Жасау/Креатив)", "D) Бiлу"],
                    correct: "C",
                    explanation: "Блум таксономиясында 'Бағалау' және 'Жасау (Креатив)' ойлаудың ең жоғары деңгейлері болып табылады."
                }
            ]
        };

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;

        function startQuiz() {
            const selectedSubject = document.getElementById('subject-select').value;
            currentQuestions = quizDatabase[selectedSubject] || [];
            currentIndex = 0;
            score = 0;

            if (currentQuestions.length === 0) {
                alert('Бұл пән бойынша сұрақтар әлі қосылмаған!');
                return;
            }

            document.getElementById('setup-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');
            document.getElementById('current-subject').innerText = document.getElementById('subject-select').options[document.getElementById('subject-select').selectedIndex].text;
            document.getElementById('total-num').innerText = currentQuestions.length;

            showQuestion();
        }

        function showQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('current-num').innerText = currentIndex + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach(opt => {
                const letter = opt.charAt(0);
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-700/60 hover:bg-slate-700 p-4 rounded-xl border border-slate-600 transition flex items-center justify-between";
                btn.innerHTML = `<span>${opt}</span>`;
                btn.onclick = () => selectAnswer(btn, letter, q);
                container.appendChild(btn);
            });
        }

        function selectAnswer(selectedBtn, letter, q) {
            const buttons = document.querySelectorAll('#options-container button');
            buttons.forEach(b => b.disabled = true);

            const isCorrect = letter === q.correct;
            const expBox = document.getElementById('explanation-box');
            const expText = document.getElementById('explanation-text');

            if (isCorrect) {
                selectedBtn.classList.add('bg-emerald-600/80', 'border-emerald-500');
                score++;
                document.getElementById('score').innerText = score;
                expBox.className = "p-5 rounded-xl mb-6 text-sm border bg-emerald-950/40 border-emerald-500/50 text-emerald-200";
            } else {
                selectedBtn.classList.add('bg-rose-600/80', 'border-rose-500');
                expBox.className = "p-5 rounded-xl mb-6 text-sm border bg-rose-950/40 border-rose-500/50 text-rose-200";
            }

            expText.innerHTML = `<strong>Дұрыс жауап: ${q.correct}</strong><br><br>${q.explanation}`;
            expBox.classList.remove('hidden');

            if (currentIndex < currentQuestions.length - 1) {
                document.getElementById('next-btn').innerText = "Келесі сұрақ ➔";
            } else {
                document.getElementById('next-btn').innerText = "Тестті аяқтау 🏁";
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                showQuestion();
            } else {
                alert(`Тест аяқталды! Сіздің нәтижеңіз: ${score} / ${currentQuestions.length}`);
                document.getElementById('setup-card').classList.remove('hidden');
                document.getElementById('quiz-card').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
